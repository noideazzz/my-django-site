{% load static %}
<!-- login.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 华侨大学</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Georgia", "Times New Roman", "Times", "Songti SC", "STSong", "华文宋体", "宋体", serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* 登录页面灰白朦胧背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(180deg, 
                    rgba(255, 255, 255, 0.7) 0%, 
                    rgba(250, 250, 250, 0.6) 50%, 
                    rgba(245, 245, 245, 0.7) 100%
                ),
                url('{% static 'image/background_grey.webp' %}') center/cover no-repeat;
            background-blend-mode: normal;
            filter: grayscale(100%) brightness(1.15) contrast(0.85) blur(0.5px);
            opacity: 0.9;
            z-index: -2;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                ellipse at center,
                rgba(255, 255, 255, 0.3) 0%,
                rgba(240, 240, 240, 0.4) 50%,
                rgba(230, 230, 230, 0.5) 100%
            );
            pointer-events: none;
            z-index: -1;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.92);
            width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.5) inset;
            border: 1px solid rgba(200,200,200,0.2);
            backdrop-filter: blur(2px);
            position: relative;
            z-index: 1;
        }

        .login-title {
            text-align: center;
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            font-weight: normal;
        }

        .form-item {
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            height: 44px;
            padding: 0 15px;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #C8102E;
        }

        .remember-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #666;
        }

        .remember-row input {
            margin-right: 6px;
            width: 14px;
            height: 14px;
            accent-color: #C8102E;
        }

        .login-btn {
            width: 100%;
            height: 44px;
            background: #C8102E;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #a00d24;
        }


    </style>
</head>
<body>
    <div class="login-box">
        <h2 class="login-title">请登录</h2>
        <form method="post" action="{% url 'users:login' %}">  <!-- 改这里 -->
            {% csrf_token %}
            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div class="form-item">
                <input type="text" name="username" class="form-input" placeholder="学号/工号/邮箱" required>
            </div>
            <div class="form-item">
                <input type="password" name="password" class="form-input" placeholder="密码" required>
            </div>
            <div class="remember-row">
                <label>
                    <input type="checkbox" name="remember_me"> 记住我
                </label>
            </div>
            <button type="submit" class="login-btn" style="margin-top: 10px;">登 录</button>
        </form>
    </div>
</body>
</html>
